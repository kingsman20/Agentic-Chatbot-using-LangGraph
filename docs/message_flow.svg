<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" width="100%" role="img" aria-label="Message flow">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9db0ff"/>
    </marker>
  </defs>

  <rect x="230" y="16" width="260" height="50" rx="12" fill="#1a2338" stroke="#4b5f8f"/>
  <text x="360" y="47" text-anchor="middle" fill="#e8edf8" font-family="DM Sans, sans-serif" font-size="16">User message</text>
  <line x1="360" y1="66" x2="360" y2="96" stroke="#9db0ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="230" y="98" width="260" height="50" rx="12" fill="#1a2338" stroke="#4b5f8f"/>
  <text x="360" y="129" text-anchor="middle" fill="#e8edf8" font-family="DM Sans, sans-serif" font-size="16">LangGraph + thread id</text>
  <line x1="360" y1="148" x2="360" y2="178" stroke="#9db0ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="230" y="180" width="260" height="50" rx="12" fill="#1a2338" stroke="#4b5f8f"/>
  <text x="360" y="211" text-anchor="middle" fill="#e8edf8" font-family="DM Sans, sans-serif" font-size="16">Load SQLite history</text>
  <line x1="360" y1="230" x2="360" y2="260" stroke="#9db0ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="210" y="262" width="300" height="54" rx="12" fill="#243056" stroke="#7c9cff"/>
  <text x="360" y="295" text-anchor="middle" fill="#f4f7ff" font-family="DM Sans, sans-serif" font-size="17" font-weight="600">chat_node / LLM</text>

  <!-- to tools -->
  <path d="M250 316 L250 350 L140 350 L140 378" fill="none" stroke="#9db0ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="160" y="344" fill="#9aa6c1" font-family="DM Sans, sans-serif" font-size="13">tool call</text>

  <rect x="40" y="380" width="200" height="50" rx="12" fill="#1a2338" stroke="#4b5f8f"/>
  <text x="140" y="411" text-anchor="middle" fill="#e8edf8" font-family="DM Sans, sans-serif" font-size="16">tools</text>

  <line x1="140" y1="430" x2="140" y2="478" stroke="#9db0ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="152" y="458" fill="#9aa6c1" font-family="DM Sans, sans-serif" font-size="13">stock purchase</text>

  <rect x="40" y="480" width="200" height="50" rx="12" fill="#1a2338" stroke="#4b5f8f"/>
  <text x="140" y="511" text-anchor="middle" fill="#e8edf8" font-family="DM Sans, sans-serif" font-size="16">Approve or Reject</text>

  <!-- other tools back to LLM -->
  <path d="M40 405 L18 405 L18 289 L210 289" fill="none" stroke="#9db0ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="24" y="248" fill="#9aa6c1" font-family="DM Sans, sans-serif" font-size="13">other tools</text>

  <!-- approval back to LLM -->
  <path d="M40 505 L18 505 L18 560 L360 560 L360 316" fill="none" stroke="#9db0ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="190" y="552" fill="#9aa6c1" font-family="DM Sans, sans-serif" font-size="13">resume</text>

  <!-- final answer -->
  <path d="M470 316 L470 350 L580 350 L580 378" fill="none" stroke="#9db0ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="488" y="344" fill="#9aa6c1" font-family="DM Sans, sans-serif" font-size="13">final answer</text>

  <rect x="480" y="380" width="200" height="50" rx="12" fill="#1a2338" stroke="#4b5f8f"/>
  <text x="580" y="411" text-anchor="middle" fill="#e8edf8" font-family="DM Sans, sans-serif" font-size="16">Show reply</text>

  <line x1="580" y1="430" x2="580" y2="478" stroke="#9db0ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="480" y="480" width="200" height="50" rx="12" fill="#1a2338" stroke="#4b5f8f"/>
  <text x="580" y="511" text-anchor="middle" fill="#e8edf8" font-family="DM Sans, sans-serif" font-size="16">Save SQLite</text>
</svg>
